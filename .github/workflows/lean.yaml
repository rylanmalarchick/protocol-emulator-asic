name: lean
on: [push, workflow_dispatch]
jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # Builds lean/ and fails on any axiom outside the standard three
      # (sorry, native_decide, or a custom axiom).
      - name: Build and audit axioms
        uses: leanprover/lean-action@v1.6.2
        with:
          lake-package-directory: lean
          axiom-audit: "true"
          axiom-audit-root: ProtoEmu
